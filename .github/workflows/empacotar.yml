name: Empacotar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-14
            nome: macos-arm64
          - os: macos-15-intel
            nome: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: dualsense-studio
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/dualsense-painel
          path: dualsense-painel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Versão
        shell: bash
        run: echo "VERSAO=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0)" >> "$GITHUB_ENV"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dualsense-studio/requirements.txt pyinstaller
      - name: Testes
        working-directory: dualsense-studio
        env:
          PYTHONPATH: ../dualsense-painel
        run: python -m unittest discover -s tests -t .
      - name: PyInstaller
        working-directory: dualsense-studio
        env:
          DUALSENSE_PAINEL: ${{ github.workspace }}/dualsense-painel
        run: python -m PyInstaller --noconfirm empacotar/dualsense-studio.spec
      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        working-directory: dualsense-studio/empacotar
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          iscc /DVersao=$env:VERSAO windows.iss
          Move-Item "../dist/Instalar-DualSense-Studio.exe" "../dist/DualSense-Studio-windows.exe"
      - name: Imagem de disco (macOS)
        if: runner.os == 'macOS'
        working-directory: dualsense-studio/dist
        run: |
          mkdir dmg
          ditto "DualSense Studio.app" "dmg/DualSense Studio.app"
          ln -s /Applications dmg/Aplicativos
          hdiutil create -volname "DualSense Studio" -srcfolder dmg -ov -format UDZO "DualSense-Studio-${{ matrix.nome }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: DualSense-Studio-${{ matrix.nome }}
          path: |
            dualsense-studio/dist/DualSense-Studio-*.exe
            dualsense-studio/dist/DualSense-Studio-*.dmg
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dualsense-studio/dist/DualSense-Studio-*.exe
            dualsense-studio/dist/DualSense-Studio-*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: dualsense-studio
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/dualsense-painel
          path: dualsense-painel
      - name: Pacote .deb
        working-directory: dualsense-studio
        env:
          DUALSENSE_PAINEL: ${{ github.workspace }}/dualsense-painel
        run: |
          VERSAO=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0)
          sh empacotar/deb.sh "$VERSAO"
      - uses: actions/upload-artifact@v4
        with:
          name: DualSense-Studio-linux
          path: dualsense-studio/dist/dualsense-studio_*.deb
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dualsense-studio/dist/dualsense-studio_*.deb
